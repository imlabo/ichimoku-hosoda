# 置き場所: .github/workflows/screener.yml
name: daily-screener

on:
  schedule:
    - cron: "30 8 * * 1-5"   # 17:30 JST 平日（UTC 08:30）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance==1.7.0" curl_cffi pandas numpy requests openpyxl xlrd

      # 失敗しても後続で last_run.log を commit したいので continue-on-error
      - name: run screener
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          python -u screener/screener.py 2>&1 | tee screener/last_run.log

      - name: commit watchlist
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add screener/watchlist.json screener/watchlist.md screener/daily screener/last_run.log
          if git diff --cached --quiet; then
            echo "変更なし"; exit 0
          fi
          git commit -m "screener: $(date -u +%F)"
          # 実行中に別のコミットが入ると push が弾かれるのでリベースして再試行
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push に失敗。10秒待って再試行 ($i/3)"
            sleep 10
          done
          echo "push に3回失敗しました"
          exit 1

      - name: fail if screener failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "screener が異常終了しました。screener/last_run.log を確認してください。"
          exit 1
