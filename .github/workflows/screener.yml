# 置き場所: .github/workflows/screener.yml
name: daily-screener

on:
  schedule:
    - cron: "10 7 * * 1-5"   # 16:10 JST 平日（UTC 07:10）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests xlrd
      - run: python screener/screener.py
      - name: commit watchlist
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add screener/watchlist.json screener/watchlist.md screener/daily
          git diff --cached --quiet || git commit -m "screener: $(date -u +%F)"
          git push
