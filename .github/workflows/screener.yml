# 置き場所: .github/workflows/screener.yml
# 市場ごとに別ジョブ（別ランナー＝別IP）で取得 → merge で1本の監視リストにまとめる。
# 出力は screener-data ブランチへ。main に置くと毎日の更新が Render の再ビルドを起こすため。
name: daily-screener

on:
  schedule:
    - cron: "30 8 * * 1-5"   # 17:30 JST 平日（UTC 08:30）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        market: [プライム, スタンダード, グロース]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance==1.7.0" curl_cffi pandas numpy requests openpyxl xlrd lxml
      - name: screen
        env:
          SCREENER_MODE: shard
          SCREENER_MARKETS: ${{ matrix.market }}
        run: |
          set -o pipefail
          python -u screener/screener.py 2>&1 | tee "screener/last_run-${{ matrix.market }}.log"
      - name: publish shard
        if: always()
        run: |
          screener/publish.sh "shard(${{ matrix.market }}): $(date -u +%F)" \
            screener/shards "screener/last_run-${{ matrix.market }}.log"

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance==1.7.0" curl_cffi pandas numpy requests openpyxl xlrd lxml
      - name: fetch shards from data branch
        run: |
          git fetch origin screener-data --depth 1
          git checkout origin/screener-data -- screener/shards screener/watchlist.json 2>/dev/null || \
            git checkout origin/screener-data -- screener/shards
          ls -la screener/shards
      - name: merge shards
        env:
          SCREENER_MODE: merge
        run: |
          set -o pipefail
          python -u screener/screener.py 2>&1 | tee screener/last_run.log
      - name: publish watchlist
        if: always()
        run: |
          screener/publish.sh "screener: $(date -u +%F)" \
            screener/watchlist.json screener/watchlist.md screener/daily screener/last_run.log
