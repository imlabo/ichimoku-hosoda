name: probe-jpx
on:
  push:
    branches: [probe-jpx]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install openpyxl pandas
      - shell: bash
        run: |
          set +e
          mkdir -p probe && cd probe
          exec > >(tee log.txt) 2>&1
          set -x
          UA="Mozilla/5.0"
          curl -sSL -A "$UA" https://www.jpx.co.jp/markets/statistics-derivatives/daily/index.html -o daily.html
          grep -oE '(href|src)="[^"]*"' daily.html | grep -vE '_assets|\.html"' > daily_links.txt
          grep -oE '[A-Za-z0-9_/.-]*(json|zip|Daily_Report)[A-Za-z0-9_/.-]*' daily.html | sort -u >> daily_links.txt
          Z=$(grep -oE '[^"]*Daily_Report_OSE_[0-9]{8}\.zip' daily.html | head -1)
          echo "ZIP=$Z"
          [ -n "$Z" ] && curl -sSL -A "$UA" "https://www.jpx.co.jp$Z" -o ose.zip && unzip -o ose.zip -d ose && ls -la ose
          rm -f oi.xlsx rb.csv tv.html sp.html
          ls -la
      - if: always()
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add probe && git commit -m "probe output" && git push
