<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一目均衡表 節目判定</title>
<script src="/static/plotly.min.js" charset="utf-8"></script>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e5e2da;--acc:#8a5a1e;--up:#c0392b;--dn:#1f5f8b;--lv:#7d3c98;--cd:#b9770e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 14px 0 0;font-weight:600;letter-spacing:.02em}
header h1 small{color:var(--mute);font-weight:400;margin-left:8px}
input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
input#code{font-size:15px}
#sugg div{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
#sugg div:hover,#sugg div.on{background:#f6f0e6}
#sugg b{min-width:64px;font-variant-numeric:tabular-nums}
#sugg span{color:var(--mute);font-size:11px;margin-left:auto;white-space:nowrap}
#stockname{font-size:15px;font-weight:600;margin-left:4px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink);cursor:pointer}
button.primary:disabled{opacity:.5;cursor:wait}
label.file{color:var(--mute);cursor:pointer;font-size:12px}
label.file input{display:none}
#status{color:var(--mute);font-size:12px;margin-left:auto}
#status.err{color:var(--up)}
.tabs{display:flex;gap:4px;padding:10px 18px 0}
.tabs button{border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:#ecebe5;color:var(--mute);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(360px,1fr);gap:14px;padding:0 18px 24px}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:12px}
#chart{height:560px}
.verdict{background:#fbf7ee;border-left:3px solid var(--acc);padding:10px 12px;border-radius:4px;margin-bottom:12px}
.verdict li{margin:4px 0;line-height:1.55}
h2{font-size:14px;margin:14px 0 6px;color:var(--acc);letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cd:hover{background:#fdf6e7;cursor:pointer}
.tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:11px;background:#eee;color:#444;margin-right:3px}
.tag.E{background:#fde2dd;color:var(--up)} .tag.N,.tag.V{background:#e5edf5;color:var(--dn)} .tag.NT{background:#eee}
.ok{color:#2e7d32}.ng{color:var(--up)}
details{margin-top:14px}
details summary{cursor:pointer;color:var(--mute)}
.md{font-size:13px;line-height:1.6}
.md h2{font-size:15px;color:var(--ink);margin-top:18px}
.md h3{font-size:13.5px;color:var(--acc)}
.md code{background:#f1efe8;padding:0 4px;border-radius:3px}
.muted{color:var(--mute);font-size:12px}
.nb{display:flex;flex-wrap:wrap;gap:8px}
.nb div{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;min-width:150px}
.nb b{font-size:15px}
#layers label{margin-right:10px;cursor:pointer}
tr.lv{cursor:pointer} tr.lv:hover{background:#f6f0fa} tr.lv.sel{background:#efe4f5}
tr.wv:hover{background:#fbf3e6} tr.wv.sel{background:#f7e9d2}
.hist span{display:inline-block;margin-right:3px;padding:0 4px;border-radius:3px;font-size:11px}
.hist .陽{background:#fde2dd;color:var(--up)} .hist .陰{background:#e5edf5;color:var(--dn)}
</style>
</head>
<body>
<header>
  <h1>一目均衡表 節目判定<small>細田哲生（三世一目山人）理論ベース</small></h1>
  <div style="position:relative">
    <input id="code" placeholder="コード or 銘柄名（例: 4506 / 住友ファーマ / 日経平均）" value="" autocomplete="off" style="width:300px">
    <div id="sugg" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.08);z-index:20;max-height:320px;overflow:auto;font-size:13px"></div>
  </div>
  <select id="period" title="日足の期間（週足・月足もこの範囲から作成）"><option value="6mo">6か月</option><option value="1y">1年</option><option value="3y">3年</option><option value="6y" selected>6年</option></select>
  <button class="primary" id="go">分析</button>
  <label class="file">CSV を読む <input type="file" id="csv" accept=".csv,text/csv"></label>
  <span id="status">コードを入力して「分析」。動作確認は DEMO</span>
</header>
<div class="tabs" id="tabs"></div>
<div id="layers" style="display:none;padding:6px 18px 0;font-size:12px;color:var(--mute)">
  表示: <label><input type="checkbox" id="ly_level" checked> 相場水準</label>
  <label><input type="checkbox" id="ly_calc" checked> 計算値</label>
  <label><input type="checkbox" id="ly_cd" checked> 変化日</label>
  <label><input type="checkbox" id="ly_d" checked> D予測日</label>
  <label><input type="checkbox" id="ly_piv" checked> 高値安値ラベル</label>
  　本数: <select id="bars"><option value="120">120</option><option value="200" selected>200</option><option value="320">320</option></select>
  <button id="recalc" disabled style="margin-left:14px;padding:4px 12px;font-size:12px;border-color:#b03a2e;color:#b03a2e;cursor:pointer">A・B・C で再計算</button>
  <span id="recalcnote" class="muted"></span>
</div>
<main>
  <section class="panel"><div id="chart"></div><div class="muted" id="legendnote">紫点線＝相場水準候補、橙の縦線＝変化日候補（数字はスコア）、▲▼＝高値・安値（大きいほど重要）</div></section>
  <section class="panel" id="side"><p class="muted">ここに総合所見・節目・変化日が表示されます。</p></section>
</main>
<script>
let DATA=null, FRAME='daily', INV=false, SEL_WAVE=0;
const $=s=>document.querySelector(s);
const fmt=v=>v==null?'-':v.toLocaleString('ja-JP',{maximumFractionDigits:v<100?3:1});
const st=(m,err)=>{const e=$('#status');e.textContent=m;e.className=err?'err':''};

async function run(){
  const code=$('#code').value.trim(); if(!code)return;
  $('#go').disabled=true; st(`${code} を取得・分析中…`);
  try{
    const r=await fetch(`/api/analyze?code=${encodeURIComponent(code)}&period=${$('#period').value}`);
    if(!r.ok){const j=await r.json().catch(()=>({detail:r.statusText})); throw new Error(j.detail)}
    DATA=await r.json(); FRAME='daily'; SEL_WAVE=0; render(); st(`${DATA.display_name?DATA.display_name+'（'+DATA.name+'）':DATA.name}  ${DATA.from} 〜 ${DATA.to}（${DATA.bars}本）`);
  }catch(e){st(e.message,true)} finally{$('#go').disabled=false}
}
$('#go').onclick=()=>{hideSugg();run()};
let SUGG=[], SUGG_I=-1, sTimer=null;
const hideSugg=()=>{$('#sugg').style.display='none'; SUGG_I=-1};
const pick=i=>{const x=SUGG[i]; if(!x) return; $('#code').value=x.code; hideSugg(); run()};
const drawSugg=()=>{const b=$('#sugg'); if(!SUGG.length){hideSugg();return}
  b.innerHTML=SUGG.map((x,i)=>`<div class="${i===SUGG_I?'on':''}" data-i="${i}"><b>${x.code}</b>${x.name}<span>${x.market||''}${x.industry?'・'+x.industry:''}</span></div>`).join('');
  b.style.display='block'; b.querySelectorAll('div').forEach(d=>d.onmousedown=e=>{e.preventDefault(); pick(+d.dataset.i)})};
$('#code').addEventListener('input',()=>{clearTimeout(sTimer); const q=$('#code').value.trim(); if(!q){SUGG=[];hideSugg();return}
  sTimer=setTimeout(async()=>{try{const r=await fetch('/api/search?q='+encodeURIComponent(q)); const j=await r.json(); SUGG=j.results||[]; SUGG_I=-1; drawSugg()}catch(e){}},220)});
$('#code').addEventListener('keydown',e=>{
  if($('#sugg').style.display==='block'&&SUGG.length){
    if(e.key==='ArrowDown'){SUGG_I=Math.min(SUGG.length-1,SUGG_I+1);drawSugg();e.preventDefault();return}
    if(e.key==='ArrowUp'){SUGG_I=Math.max(0,SUGG_I-1);drawSugg();e.preventDefault();return}
    if(e.key==='Enter'&&SUGG_I>=0){pick(SUGG_I);e.preventDefault();return}
    if(e.key==='Escape'){hideSugg();return}}
  if(e.key==='Enter'){hideSugg();run()}});
$('#code').addEventListener('blur',()=>setTimeout(hideSugg,150));
$('#csv').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return; const fd=new FormData(); fd.append('file',f); fd.append('name',f.name.replace(/\.csv$/i,''));
  st(`${f.name} を分析中…`);
  try{const r=await fetch('/api/analyze_csv',{method:'POST',body:fd}); if(!r.ok){const j=await r.json();throw new Error(j.detail)}
    DATA=await r.json(); FRAME='daily'; render(); st(`${DATA.name}  ${DATA.from} 〜 ${DATA.to}（${DATA.bars}本）`)}catch(err){st(err.message,true)}
});

function render(){
  const names={m5:'5分足',h1:'1時間足',daily:'日足',weekly:'週足',monthly:'月足'};
  const base=FRAME.replace(/_inv$/,'');
  const order=['m5','h1','daily','weekly','monthly'].filter(k=>DATA.frames[k]);
  $('#tabs').innerHTML=order.map(k=>`<button class="${k===base?'on':''}" data-k="${k}">${names[k]}</button>`).join('')+
    `<label style="align-self:center;margin-left:14px;font-size:12px;cursor:pointer;${INV?'color:#1f5f8b;font-weight:600':''}"><input type="checkbox" id="invtoggle" ${INV?'checked':''}> 上下反転</label>`+
    (DATA.notes&&DATA.notes.length?`<span class="muted" style="align-self:center;margin-left:10px">${DATA.notes.join('、')}</span>`:'');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{FRAME=b.dataset.k+(INV&&DATA.frames[b.dataset.k+'_inv']?'_inv':'');SEL_WAVE=0;render()});
  $('#invtoggle').onchange=e=>{INV=e.target.checked; FRAME=base+(INV&&DATA.frames[base+'_inv']?'_inv':''); SEL_WAVE=0; render()};
  const F=DATA.frames[FRAME]||DATA.frames[base]; $('#layers').style.display='block'; drawChart(F); drawSide(F);
}
let SEL_LEVEL=null;
['ly_level','ly_calc','ly_cd','ly_d','ly_piv','bars'].forEach(id=>$('#'+id).addEventListener('change',()=>{if(DATA)drawChart(DATA.frames[FRAME])}));
const LY=id=>$('#'+id).checked;

function drawChart(F){
  const nb=+$('#bars').value, O=F.ohlc, n=O.date.length, from=Math.max(0,n-nb);
  const o={date:O.date.slice(from),open:O.open.slice(from),high:O.high.slice(from),low:O.low.slice(from),close:O.close.slice(from)};
  const L=F.lines, lfrom=L.date.indexOf(o.date[0]); const Ls={}; for(const k in L) Ls[k]=L[k].slice(lfrom<0?0:lfrom);
  const u=F.unit;
  // 横軸（カテゴリ）: 実バー＋将来の日付を時系列順に。D 予測日が遠い場合はその日まで延ばす
  const fut=F.future_all||F.future_dates, selW=F.waves[SEL_WAVE]||F.waves[0];
  const want=new Set(F.future_dates.concat(Ls.date.filter(d=>d>o.date[o.date.length-1])));
  if(selW&&LY('ly_d')) selW.d_info.forEach(d=>{ if(d.date&&d.offset>=0){ const k=fut.indexOf(d.date); if(k>=0) fut.slice(0,k+3).forEach(x=>want.add(x)) } });
  const allDates=o.date.concat(fut.filter(d=>want.has(d)));
  const traces=[
    {x:allDates,y:allDates.map(()=>null),type:'scatter',mode:'markers',marker:{opacity:0},showlegend:false,hoverinfo:'skip'},
    {type:'candlestick',x:o.date,open:o.open,high:o.high,low:o.low,close:o.close,name:'実線',
     increasing:{line:{color:'#c0392b',width:1}},decreasing:{line:{color:'#1f5f8b',width:1}},whiskerwidth:.3,hoverinfo:'x+y'},
    {x:Ls.date,y:Ls.span_tk,name:'先行(基準転換)',line:{color:'#8e9aaf',width:1},hoverinfo:'skip'},
    {x:Ls.date,y:Ls.span_52,name:'先行(52)',line:{color:'#8e9aaf',width:1,dash:'dot'},fill:'tonexty',fillcolor:'rgba(142,154,175,.18)',hoverinfo:'skip'},
    {x:Ls.date,y:Ls.tenkan,name:'転換線(9)',line:{color:'#d35400',width:1.3}},
    {x:Ls.date,y:Ls.kijun,name:'基準線(26)',line:{color:'#2c3e50',width:1.6}},
    {x:Ls.date,y:Ls.chikou,name:'遅行スパン(26)',line:{color:'#27ae60',width:1.2}},
  ];
  if(Ls.chikou_x&&F.extra_lag) traces.push({x:Ls.date,y:Ls.chikou_x,name:`遅行スパン(${F.extra_lag.n})`,line:{color:'#7f8c1a',width:1.1,dash:'dot'}});
  const inWin=d=>d>=o.date[0];
  const rp=v=>F.inverted?2*F.inverted.ref-v:v;   // 反転チャートではラベルを実際の価格に戻す
  if(LY('ly_piv')){
    const H=F.pivots.filter(p=>p.kind==='H'&&p.rank>=2&&inWin(p.date)), Lo=F.pivots.filter(p=>p.kind==='L'&&p.rank>=2&&inWin(p.date));
    traces.push({x:H.map(p=>p.date),y:H.map(p=>p.price),mode:'markers+text',type:'scatter',name:'高値',text:H.map(p=>fmt(rp(p.price))),textposition:'top center',textfont:{size:9,color:'#555'},
      marker:{symbol:'triangle-down',size:H.map(p=>5+p.rank*2),color:'#555'},hovertemplate:'高値 %{x}<br>%{y:,.1f}<extra></extra>'});
    traces.push({x:Lo.map(p=>p.date),y:Lo.map(p=>p.price),mode:'markers+text',type:'scatter',name:'安値',text:Lo.map(p=>fmt(rp(p.price))),textposition:'bottom center',textfont:{size:9,color:'#555'},
      marker:{symbol:'triangle-up',size:Lo.map(p=>5+p.rank*2),color:'#555'},hovertemplate:'安値 %{x}<br>%{y:,.1f}<extra></extra>'});
  }
  const shapes=[],ann=[];
  const ymin=Math.min(...o.low), ymax=Math.max(...o.high), span=ymax-ymin;
  const lastX=allDates[allDates.length-1];
  // ---- 相場水準: 起点から右へ線を引き、起点◆と基本数値日の現れ方●を打つ
  if(LY('ly_level')){
    const lv=F.levels.filter(l=>l.price>ymin-span*.05&&l.price<ymax+span*.05).slice(0,6);
    lv.forEach((l,i)=>{const sel=SEL_LEVEL===l.price, col=sel?'#5b1a86':'#7d3c98', x0=inWin(l.origin)?l.origin:o.date[0];
      shapes.push({type:'line',x0,x1:lastX,y0:l.price,y1:l.price,line:{color:col,width:sel?2:1,dash:'dot'}});
      ann.push({x:x0,y:l.price,text:`水準${i+1} ${fmt(rp(l.price))}`,showarrow:false,xanchor:'left',yanchor:'bottom',font:{size:10,color:col},bgcolor:'rgba(255,255,255,.75)'});
      traces.push({x:[inWin(l.origin)?l.origin:null].filter(Boolean),y:[l.price],mode:'markers',type:'scatter',showlegend:false,marker:{symbol:'diamond',size:9,color:col},hovertemplate:`水準${i+1} 起点 ${l.origin}<br>${l.source}<extra></extra>`});
      const hs=l.hits.filter(h=>inWin(h.date));
      if(hs.length) traces.push({x:hs.map(h=>h.date),y:hs.map(()=>l.price),mode:'markers',type:'scatter',showlegend:false,marker:{size:6,color:col,symbol:hs.map(h=>h.what==='高値'?'triangle-down':h.what==='安値'?'triangle-up':'circle')},
        hovertemplate:hs.map(h=>`水準${i+1} 起点から ${h.n}${u}目: ${h.what}`).map(t=>t+'<extra></extra>')});
      l.next_basic.slice(0,1).forEach(nb2=>{ if(nb2.date&&allDates.includes(nb2.date)) traces.push({x:[nb2.date],y:[l.price],mode:'markers',type:'scatter',showlegend:false,marker:{size:7,color:col,symbol:'circle-open'},hovertemplate:`水準${i+1} 次の基本数値 ${nb2.n}${u}目<extra></extra>`})});
    });
  }
  // ---- 計算値
  if(LY('ly_calc')){
    const col={E:'#c0392b',N:'#1f5f8b',V:'#1f5f8b',NT:'#6b7280'};
    const up=F.calc.filter(x=>x.price>F.close&&!x.achieved).slice(0,3), dn=F.calc.filter(x=>x.price<F.close&&!x.achieved).slice(-3);
    up.concat(dn).forEach(x=>{ if(x.price<ymin-span*.05||x.price>ymax+span*.08) return; const k=x.kinds.split('/')[0];
      shapes.push({type:'line',xref:'paper',x0:0.6,x1:1,y0:x.price,y1:x.price,line:{color:col[k]||'#555',width:1.2,dash:'longdash'}});
      ann.push({xref:'paper',x:0.61,y:x.price,text:`${x.kinds} ${fmt(rp(x.price))}${x.n>1?' ×'+x.n:''}`,showarrow:false,xanchor:'left',yanchor:'bottom',font:{size:10,color:col[k]||'#555'}})});
    const w=F.waves[SEL_WAVE]||F.waves[0];
    if(w){
      // 選択中の三波動の計算値（E/N/V/NT）を右端に短く
      Object.entries(w.calc).forEach(([k,v],j)=>{ if(v<ymin-span*.1||v>ymax+span*.12) return;
        shapes.push({type:'line',xref:'paper',x0:0.78,x1:1,y0:v,y1:v,line:{color:'#8a5a1e',width:1.4,dash:w.achieved[k]?'dot':'solid'}});
        ann.push({xref:'paper',x:0.785,y:v,text:`${k} ${fmt(rp(v))}${w.achieved[k]?' ✓':''}`,showarrow:false,xanchor:'left',yanchor:'bottom',font:{size:10,color:'#8a5a1e'}})});
    }
  }
  // ---- 選択中の三波動 A-B-C（ドラッグで移動できる）
  ABC=null;
  if(selW){ const first=o.date[0], clip=d=>d<first?first:d, out=[selW.A[0],selW.B[0],selW.C[0]].map(d=>d<first), col=selW.manual?'#b03a2e':'#8a5a1e';
    ABC={ti:traces.length, F, o, base:(F.ohlc_from||0)+from, allDates, dir:selW.dir, full:[selW.A_i,selW.B_i,selW.C_i],
         x:[clip(selW.A[0]),clip(selW.B[0]),clip(selW.C[0])], out, rp, real:[selW.A[1],selW.B[1],selW.C[1]]};
    // 表示範囲外の点は枠の端に寄せて描く（つかんで動かせるように）
    // 動かしたが未計算の位置があれば復元
    ABC.key=FRAME+'|'+SEL_WAVE+'|'+selW.A_i+'|'+selW.C_i;
    ABC.kind=selW.dir==='up'?['L','H','L']:['H','L','H'];
    if(PEND&&PEND.key===ABC.key){ ['x','full','real','out','kind'].forEach(k=>ABC[k]=PEND[k].slice()) }
    ABC.yl=ymin-span*.07; ABC.yh=ymax+span*.11; ABC.y=ABC.real.map(v=>Math.max(ABC.yl,Math.min(ABC.yh,v)));
    // 吸着先 = チャート上の ▲▼（表示中の高値・安値）
    ABC.piv=F.pivots.filter(p=>p.rank>=2&&inWin(p.date));
    traces.push({x:ABC.x.slice(),y:ABC.y.slice(),mode:'lines+markers+text',type:'scatter',name:`三波動 A-B-C${selW.manual?'（手動）':''}（起点 ${selW.A[0]}${out[0]?'・表示範囲外':''}）`,
      text:['A','B','C'].map((l,j)=>l+(ABC.out[j]?'←範囲外':'')),textposition:'middle right',textfont:{size:13,color:col},line:{color:col,width:2,dash:PEND&&PEND.key===ABC.key?'dash':'solid'},
      customdata:ABC.real.map(rp),marker:{symbol:'circle-open',size:17,color:col,line:{color:col,width:3}},hovertemplate:'%{text} %{x}<br>%{customdata:,.1f}<br>（ドラッグで移動）<extra></extra>'});
  }
  // ---- 変化日（上位5件、将来のみ）: 線は下 1/3、ラベルは下端に段差
  if(LY('ly_cd')){
    ((selW&&selW.manual&&selW.cd)||F.change_dates).filter(c=>c.offset>=0).slice(0,5).forEach((c,i)=>{
      shapes.push({type:'line',x0:c.date,x1:c.date,y0:ymin-span*.04,y1:ymin+span*.45,line:{color:'#b9770e',width:1.2,dash:'dash'}});
      ann.push({x:c.date,y:ymin-span*.04+span*.05*(i%3),text:`${c.date.slice(5)}（${c.score}）`,showarrow:false,font:{size:9,color:'#b9770e'},bgcolor:'rgba(255,255,255,.85)',xanchor:'left',yanchor:'bottom'})});
  }
  // ---- D 予測日（上位2波動、将来のみ）: 線は上 1/3、ラベルは上端
  if(LY('ly_d')){
    const seen=new Set(); const ws=[F.waves[SEL_WAVE]||F.waves[0]].filter(Boolean);
    ws.forEach((w,wi)=>w.d_info.forEach(d=>{ if(!d.date||d.offset<0||seen.has(d.date)) return; seen.add(d.date);
      shapes.push({type:'line',x0:d.date,x1:d.date,y0:ymin+span*.55,y1:ymax+span*.04,line:{color:'#0e7c86',width:1.4,dash:'dot'}});
      ann.push({x:d.date,y:ymax+span*.075,text:`<b>${d.date.slice(5)}</b>`,showarrow:false,font:{size:10,color:'#0e7c86'},bgcolor:'rgba(255,255,255,.9)',xanchor:'center',yanchor:'bottom'});
      ann.push({x:d.date,y:ymax+span*.04-span*.05*(seen.size%3),text:`D ${d.rel}（+${d.offset}${u}）`,showarrow:false,font:{size:9,color:'#0e7c86'},bgcolor:'rgba(255,255,255,.85)',xanchor:'left',yanchor:'top'})}));
  }
  Plotly.newPlot('chart',traces,{
    title:{text:`${DATA.display_name?'<b>'+DATA.display_name+'</b>（'+DATA.name+'）':DATA.name}  ${F.label}  終値 ${fmt(rp(F.close))}（${F.last_date}）${F.inverted?'　※チャート上のラベルは実際の価格、右パネルの数値は反転値':''}`,font:{size:13}},
    margin:{l:50,r:20,t:40,b:30},xaxis:{rangeslider:{visible:false},type:'category',categoryorder:'array',categoryarray:allDates,tickmode:'auto',nticks:8,tickangle:0,showgrid:false,tickfont:{size:10}},
    yaxis:Object.assign({tickformat:',.0f',gridcolor:'#eee',range:[ymin-span*.08,ymax+span*.12]}, F.inverted?(()=>{const r=F.inverted.ref, step=niceStep(span/8), vals=[]; for(let v=Math.ceil((ymin-span*.08)/step)*step; v<=ymax+span*.08; v+=step) vals.push(v); return {tickvals:vals,ticktext:vals.map(v=>fmt(2*r-v)),title:{text:'実際の価格（上下反転）',font:{size:11}}}})():{}),shapes,annotations:ann,legend:{orientation:'h',y:-0.05,font:{size:11}},
    hovermode:'closest',paper_bgcolor:'#fff',plot_bgcolor:'#fff'},{responsive:true,displaylogo:false});
  updRecalc();
  const gd=$('#chart'); setupDrag(gd); gd.removeAllListeners&&gd.removeAllListeners('plotly_click');
  gd.on('plotly_click',async ev=>{const pt=ev.points&&ev.points[0]; if(!pt||!(pt.data.name==='高値'||pt.data.name==='安値')) return;
    const piv=F.pivots.find(p=>p.date===pt.x&&Math.abs(p.price-pt.y)<1e-6); if(!piv) return;
    st(`起点 A = ${piv.date} ${fmt(rp(piv.price))} の三波動を計算中…`);
    try{const r=await fetch(`/api/waves_from?code=${encodeURIComponent($('#code').value.trim())}&frame=${FRAME}&a_i=${piv.i}&period=${$('#period').value}`);
      if(!r.ok){const j=await r.json();throw new Error(j.detail)} const j=await r.json();
      if(!j.waves.length){st('その起点では三波動が成立しません（押し・戻りが起点を越えている）');return}
      const key=w=>w.A[0]+'|'+w.C[0]; const have=new Set(F.waves.map(key));
      const add=j.waves.filter(w=>!have.has(key(w))); F.waves=add.concat(F.waves); SEL_WAVE=0; drawChart(F); drawSide(F);
      st(`起点 ${piv.date} の三波動 ${j.waves.length} 件を追加（先頭に表示）`)}catch(e){st(e.message,true)}});
  $('#legendnote').textContent='紫点線＝相場水準（◆起点、▲▼●＝起点からの基本数値日に高値・安値・同水準、○＝次の基本数値日）／橙破線＝変化日候補（下側）／青緑点線＝選択中の三波動の終了予測日 D（上側）／赤・青の長破線＝未達の計算値の集中、茶色＝選択中の三波動の計算値。▲▼をクリックするとその点を起点 A にした三波動を追加／三波動の A・B・C の丸はドラッグで ▲▼ の位置へ移動でき、「A・B・C で再計算」で計算値・D・変化日を引き直す';
}

// ---- A・B・C のドラッグ（▲▼ の位置にだけ吸着）→「再計算」ボタンで計算
let ABC=null, DRAG=null, PEND=null;
function abcPx(gd){const xa=gd._fullLayout.xaxis, ya=gd._fullLayout.yaxis, tr=gd.data[ABC.ti];
  return tr.x.map((x,k)=>({px:xa._offset+xa.l2p(ABC.allDates.indexOf(x)), py:ya._offset+ya.l2p(tr.y[k])}))}
function updRecalc(){const on=!!(PEND&&ABC&&PEND.key===ABC.key); $('#recalc').disabled=!on;
  $('#recalcnote').textContent=on?'未計算：A・B・C を動かしました。ボタンを押すと変化日・計算値・D を引き直します':(ABC?'A・B・C の丸をドラッグして ▲▼（高値・安値どちらでも）へ動かせます。上げ／下げは A→B の向きで自動判定':'')}
function setupDrag(gd){
  if(gd._abcDrag) return; gd._abcDrag=true;
  const rel=e=>{const r=gd.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]};
  const hit=e=>{ if(!ABC||!gd._fullLayout||!gd.data[ABC.ti]) return -1; const [mx,my]=rel(e); let best=-1, bd=16;
    abcPx(gd).forEach((p,k)=>{const d=Math.hypot(p.px-mx,p.py-my); if(d<bd){bd=d;best=k}}); return best};
  const setCursor=c=>{const el=gd.querySelector('.nsewdrag'); if(el) el.style.cursor=c};
  gd.addEventListener('pointerdown',e=>{const k=hit(e); if(k<0) return;
    e.preventDefault(); e.stopPropagation(); DRAG={k, moved:false}; setCursor('grabbing')},true);
  gd.addEventListener('mousedown',e=>{ if(DRAG){e.preventDefault(); e.stopPropagation()} },true);
  window.addEventListener('pointermove',e=>{
    if(!DRAG){ if(e.target&&gd.contains(e.target)) setCursor(hit(e)>=0?'grab':''); return }
    e.preventDefault();
    // ▲（高値）▼… どちらでも：マウスに画面上で一番近い印に吸着
    const xa=gd._fullLayout.xaxis, ya=gd._fullLayout.yaxis, [mx,my]=rel(e), k=DRAG.k, cands=ABC.piv;
    if(!cands.length) return;
    let p=cands[0], bd=1e9; cands.forEach(q=>{const px=xa._offset+xa.l2p(ABC.allDates.indexOf(q.date)), py=ya._offset+ya.l2p(q.price), d=Math.hypot(px-mx,(py-my)*0.6); if(d<bd){bd=d;p=q}});
    if(ABC.full[k]===p.i&&ABC.kind[k]===p.kind&&DRAG.moved) return;
    const kind=p.kind; ABC.kind[k]=kind; ABC.x[k]=p.date; ABC.real[k]=p.price; ABC.y[k]=Math.max(ABC.yl,Math.min(ABC.yh,p.price)); ABC.full[k]=p.i; ABC.out[k]=false; DRAG.moved=true;
    const lab=['A','B','C'];
    Plotly.update(gd,{x:[ABC.x.slice()],y:[ABC.y.slice()],customdata:[ABC.real.map(ABC.rp)],text:[lab.map((l,j)=>l+(ABC.out[j]?'←範囲外':''))],'line.dash':'dash'},{'xaxis.type':'category'},[ABC.ti]);
    st(`${lab[k]} → ${p.date} の${kind==='L'?'安値':'高値'} ${fmt(ABC.rp(p.price))}`)},{passive:false});
  window.addEventListener('pointerup',()=>{ if(!DRAG) return; const d=DRAG; DRAG=null; setCursor(''); if(!d.moved) return;
    PEND={key:ABC.key, x:ABC.x.slice(), full:ABC.full.slice(), real:ABC.real.slice(), out:ABC.out.slice(), kind:ABC.kind.slice()}; updRecalc();
    const [a,b,c]=ABC.full;
    if(!(a<b&&b<c)) st('A → B → C の順（A が最も古い）に並ぶように置いてください',true);
    else st('位置を変えました。「A・B・C で再計算」を押すと変化日・計算値・D を引き直します')});
}
async function recalc(){
  if(!PEND||!ABC||PEND.key!==ABC.key) return;
  const [a,b,c]=PEND.full, F=ABC.F, kinds=PEND.kind.join('');
  if(!(a<b&&b<c)){st('A → B → C の順（A が最も古い）に並ぶように置いてください',true); return}
  $('#recalc').disabled=true; st('指定した A・B・C で計算値・D・変化日を計算中…');
  try{const r=await fetch(`/api/wave_custom?code=${encodeURIComponent($('#code').value.trim())}&frame=${FRAME}&period=${$('#period').value}&a=${a}&b=${b}&c=${c}&kinds=${kinds}`);
    const j=await r.json(); if(!r.ok) throw new Error(j.detail);
    PEND=null; F.waves=[j.wave].concat(F.waves.filter(w=>!w.manual)); SEL_WAVE=0; drawChart(F); drawSide(F);
    const warn=j.wave.note&&j.wave.note.includes('注意');
    st(`再計算しました（${j.wave.dir==='up'?'上げ':'下げ'}三波動）：A ${j.wave.A[0]} ${fmt(ABC.rp(j.wave.A[1]))} → B ${j.wave.B[0]} ${fmt(ABC.rp(j.wave.B[1]))} → C ${j.wave.C[0]} ${fmt(ABC.rp(j.wave.C[1]))}${warn?'　'+j.wave.note.split('注意: ')[1]:''}`, warn)
  }catch(err){st(err.message,true); updRecalc()}
}
$('#recalc').onclick=recalc;

function drawSide(F){
  const u=F.unit, c=F.close, u_=u;
  let h='';
  if(F.inverted) h+=`<div class="verdict" style="background:#eef3f8;border-left-color:#1f5f8b"><b>上下反転チャート</b>：${F.inverted.note}。基準 ${fmt(F.inverted.ref)}。下げ相場を上げ相場として読み直すことで、戻りの限界・下げ三波動の終了予測日・下げ側の計算値を、上げ相場と同じ型で確認できます。</div>`;
  h+=`<div class="verdict"><strong>総合所見（暫定判断と検証条件）</strong><ul>${F.verdict.map(v=>'<li>'+md(v)+'</li>').join('')}</ul></div>`;
  h+=`<div class="muted">並び順: ${F.position.order}　／　直近波形: <b>${F.waveform||'-'}</b>　／　三役: ${F.position.sanyaku}</div>`;
  if(F.extra_lag&&F.extra_lag.state&&F.extra_lag.state.rel){const e=F.extra_lag.state, rel={up:'上（好転）',down:'下（悪化）',touch:'実線に触れている'}[e.rel];
    h+=`<div class="muted" style="margin-top:4px">遅行スパン(${F.extra_lag.n}): ${e.ref_date} の実線（${fmt(e.ref_low)}〜${fmt(e.ref_high)}）に対して <b>${rel}</b>　／　${e.run_sign}${e.run}連（${F.extra_lag.n}${u}足相当）</div>`}
  h+=`<h2>三波動の終了予測日（D）</h2><div class="muted" style="margin-bottom:6px">第一波動 AB・第二波動 BC が決まれば、三波動目の時間は AB=BD／AB=CD／AC=CD で先に見積もれる。A〜D が基本数値になる日は特に重要。その日に高値（安値）となるか、反応なく続伸（延長）かを確認する。</div><table><tr><th>波動</th><th>A → B → C</th><th>関係</th><th>予測日 D</th><th class="num">あと</th><th class="num">A〜D</th></tr>`+
    [F.waves[SEL_WAVE]].concat(F.waves.filter((_,i)=>i!==SEL_WAVE)).filter(Boolean).slice(0,5).map((w,wi)=>w.d_info.map((d,di)=>`<tr${d.offset<0?' style="color:#999"':''}>${di===0?`<td rowspan="3"><b>D${wi+1}</b><br><span class="muted">${w.dir==='up'?'上げ':'下げ'}</span></td><td rowspan="3" class="muted">${w.A[0]} ${fmt(w.A[1])}<br>${w.B[0]} ${fmt(w.B[1])}<br>${w.C[0]} ${fmt(w.C[1])}<br>AB ${w.ab}・BC ${w.bc}・AC ${w.ac}${u}</td>`:''}<td>${d.rel}<br><span class="muted">${d.days}${u}</span></td><td class="num"><b>${d.date||'-'}</b></td><td class="num">${d.offset<0?`${-d.offset}${u}前（経過）`:d.offset===0?'本日':`+${d.offset}${u}`}</td><td class="num">${d.ad}${u}${d.ad_basic?`<br><span class="ok">≒基本数値 ${d.ad_basic}</span>`:''}</td></tr>`).join('')).join('')+'</table>';
  const sw=F.waves[SEL_WAVE];
  if(sw&&sw.manual&&sw.cd) h+=`<h2>手動の三波動から見た変化日</h2><div class="muted" style="margin-bottom:6px">ドラッグで決めた A ${sw.A[0]} ${fmt(sw.A[1])} → B ${sw.B[0]} ${fmt(sw.B[1])} → C ${sw.C[0]} ${fmt(sw.C[1])} からの基本数値・対等数値（B から AB、C から BC・AB・AC）と D 予測日。チャートの橙線もこの表に切り替わっています（他の候補行を選ぶと元に戻る）。</div><table><tr><th>日付</th><th class="num">${u}</th><th class="num">スコア</th><th>根拠</th></tr>`+
    sw.cd.filter(x=>x.offset>=0).slice(0,8).map(cd=>`<tr class="cd"><td class="num"><b>${cd.date}</b></td><td class="num">+${cd.offset}</td><td class="num">${cd.score}</td><td>${cd.details.slice(0,3).map(d=>'・'+d).join('<br>')}</td></tr>`).join('')+'</table>';
  h+=`<h2>時間の節目 ― 変化日候補（基本数値・対等数値・三波動・相場水準の重なり）</h2><table><tr><th>日付</th><th class="num">${u}</th><th class="num">スコア</th><th>主な根拠</th></tr>`+
    F.change_dates.slice(0,10).map(cd=>`<tr class="cd"><td class="num"><b>${cd.date}</b></td><td class="num">${cd.offset>0?'+':''}${cd.offset}</td><td class="num">${cd.score}</td><td>${cd.details.slice(0,3).map(d=>'・'+d).join('<br>')}${cd.n>3?`<br><span class="muted">…他 ${cd.n-3} 件</span>`:''}</td></tr>`).join('')+'</table>';
  const up=F.calc.filter(x=>x.price>c).slice(0,6).reverse(), dn=F.calc.filter(x=>x.price<=c).slice(-6).reverse();

    up.concat(dn).map(x=>`<tr><td class="num"><b>${fmt(x.price)}</b></td><td class="num">${x.pct>0?'+':''}${x.pct}%</td><td>${x.kinds.split('/').map(k=>`<span class="tag ${k}">${k}</span>`).join('')}×${x.n}</td><td>${x.achieved?'<span class="ok">達成済</span>':'未達'}</td></tr>`).join('')+'</table>';
  h+=`<h2>相場水準 ― どこにあるか・どう機能してきたか</h2><div class="muted" style="margin-bottom:6px">細田：もみ合いは「ある価格を相場水準に同程度の高値・安値を作る変動」。水準を初めて付けた起点からの基本数値日に、高値・安値・同水準が現れやすく、放れはこの水準から出発しやすい。水準×2−反対側の極値 ＝ もみ合いの限界。行をクリックするとチャートで強調。</div>`+
    (()=>{const lv=F.levels.slice(0,6); if(!lv.length) return ''; const near=[...lv].sort((a,b)=>Math.abs(a.pct)-Math.abs(b.pct))[0], act=lv.filter(l=>l.touch26>=6);
      const up=lv.filter(l=>l.price>F.close).sort((a,b)=>a.price-b.price)[0], dn=lv.filter(l=>l.price<F.close).sort((a,b)=>b.price-a.price)[0];
      return `<div class="verdict" style="background:#f6f0fa;border-left-color:#7d3c98"><b>現在地:</b> 現値 ${fmt(F.close)}。最も近い水準は <b>${fmt(near.price)}</b>（${near.pct>0?'+':''}${near.pct}%、${near.source}）。`+
        (up?`上の水準 ${fmt(up.price)}（+${up.pct}%）`:'上に水準なし')+'、'+(dn?`下の水準 ${fmt(dn.price)}（${dn.pct}%）`:'下に水準なし')+'。'+
        (act.length?`<br><b>相場水準として機能中:</b> ${act.map(l=>fmt(l.price)).join('、')}（直近26${u}で繰り返しまたいでいる＝この値段を軸にしたもみ合い。放れはここから出発しやすい）`:`<br>直近26${u}で繰り返しまたいでいる水準はなく、価格は水準から離れて動いている（押し戻りとして各線が機能しているかを見る局面）`)+'</div>'})()+
    F.levels.slice(0,6).map((l,i)=>{const rel=l.rel==='above'?`現値はこの水準の <b>上</b>（+${l.pct}%）`:`現値はこの水準の <b>下</b>（${l.pct}%）`;
      const func=l.touch26>=6?`直近26${u}で${l.touch26}回またいでいる → 押し戻りとしてではなく<b>相場水準として機能中</b>`:l.touch26>0?`直近26${u}で${l.touch26}回接触`:`直近26${u}は接触なし（離れている）`;
      const hits=l.hits.map(h=>`<span class="tag">${h.n}${u}目 ${h.what}</span>`).join(' ')||'<span class="muted">—</span>';
      const nxt=l.next_basic.map(x=>`${x.n}${u}目 ${x.date||'-'}（+${x.ahead}${u}）`).join('、');
      return `<table class="lvt" style="margin-bottom:10px"><tr class="lv${SEL_LEVEL===l.price?' sel':''}" data-p="${l.price}"><td style="width:28%"><div style="font-size:16px"><b>水準${i+1}　${fmt(l.price)}</b></div><div class="muted">${rel}</div><div class="muted">スコア ${l.score}</div></td>
        <td><div><b>根拠:</b> ${l.sources.join(' ／ ')}</div><div><b>起点:</b> ${l.origin}（${l.elapsed}${u}経過）</div><div><b>基本数値日の現れ方:</b> ${hits}</div><div><b>次の基本数値日:</b> ${nxt||'—'}</div>
        <div><b>もみ合い限界:</b> 上 ${fmt(l.upper)}（= ${fmt(l.price)}×2 − 安値 ${fmt(l.lo_since)}） ／ 下 ${fmt(l.lower)}（= ${fmt(l.price)}×2 − 高値 ${fmt(l.hi_since)}）</div><div class="muted">${func}</div></td></tr></table>`}).join('');
  h+=`<h2>計算値（三波動ごと・式つき）</h2><div class="muted" style="margin-bottom:6px">細田：E 達成＝上げ（下げ）の勢い優勢で方向持続しやすい／N・V 達成止まり＝BC の半値・B を中心とするもみ合いの範疇で警戒／NT＝限界。計算値は達成するか未確定、変化日は必ず来る。</div>`+
    [F.waves[SEL_WAVE]].concat(F.waves.filter((_,i)=>i!==SEL_WAVE)).filter(Boolean).slice(0,4).map(w=>{const [a,b,c]=[w.A[1],w.B[1],w.C[1]], u=w.dir==='up', sg=u?'+':'−', ab=Math.abs(b-a), bc=Math.abs(c-b), ac=Math.abs(c-a);
      const row=(k,f,v)=>`<tr><td><span class="tag ${k}">${k}</span></td><td class="muted">${f}</td><td class="num"><b>${fmt(v)}</b></td><td>${w.achieved[k]?'<span class="ok">達成</span>':`<span class="muted">${((v/F.close-1)*100).toFixed(1)}%</span>`}</td></tr>`;

        row('E',`B ${sg} (B−A) = ${fmt(b)} ${sg} ${fmt(ab)}`,w.calc.E)+row('N',`C ${sg} (B−A) = ${fmt(c)} ${sg} ${fmt(ab)}`,w.calc.N)+
        row('V',`B ${sg} (B−C) = ${fmt(b)} ${sg} ${fmt(bc)}`,w.calc.V)+row('NT',`C ${sg} (C−A) = ${fmt(c)} ${sg} ${fmt(ac)}`,w.calc.NT)+'</table>'}).join('')+
    (F.p_value?`<div style="margin:8px 0 4px"><b>P 計算値</b> <span class="muted">内はらみ：高値 ${F.p_value.A[0]} ${fmt(F.p_value.A[1])} → 高値 ${F.p_value.B[0]} ${fmt(F.p_value.B[1])}、安値 ${F.p_value.C[0]} ${fmt(F.p_value.C[1])}</span></div><table><tr><td><span class="tag">P</span></td><td class="muted">C + (A−B)</td><td class="num"><b>${fmt(F.p_value.P)}</b></td><td class="muted">上放れの目処</td></tr><tr><td><span class="tag">P</span></td><td class="muted">C − (A−B)</td><td class="num"><b>${fmt(F.p_value.P_down)}</b></td><td class="muted">割り込めば下げ三波動を考える</td></tr></table>`:'');
  h+=`<h2>三波動構成候補（起点 A を変えた複数案）</h2><div class="verdict" style="background:#fbf3e6;border-left-color:#8a5a1e;margin-bottom:6px"><b>定型の決め方</b>：下げ三波動＝A 期間の最高値 → B A 以降の最安値 → C B 以降の最高値。上げ三波動＝A 期間の最安値 → B A 以降の最高値 → C B 以降の最安値。期間は「表示期間全体」「直近250本」「直近120本」で当て、<span class="tag" style="background:#8a5a1e;color:#fff">定型</span> として先頭に並べます。B が直近で更新中（第三波動が進行中）のときは、最も深い押し（戻り）の直前の山（谷）を B、その押しの底を C とします。変化日候補はこの A・B・C からの基本数値・対等数値と D 予測日を最優先で数えています。</div><div class="muted" style="margin-bottom:6px">細田：起点と中心点をその時々に変えつつ、結果的に何らかの三波動を確認する。重要な高値・安値（★の数＝重要度）と期間の最安値・最高値は距離に関係なく起点候補に含めています。行をクリックで選択（チャートの A-B-C・計算値・D が切り替わる）。チャートの▲▼クリックで任意の点を起点にできます。チャート上の A・B・C の丸をドラッグして ▲▼（高値・安値のどちらでも）の位置へ動かし、「A・B・C で再計算」を押すと自分で決めた三波動として計算され、<span class="tag" style="background:#b03a2e;color:#fff">手動</span> として先頭に入ります。</div>`+
    `<table><tr><th></th><th>向き</th><th>起点 A</th><th>B / C</th><th class="num">時間</th><th>計算値（達成）</th><th>D 予測日</th></tr>`+
    F.waves.slice(0,12).map((w,i)=>`<tr class="wv${i===SEL_WAVE?' sel':''}" data-i="${i}" style="cursor:pointer"><td>${i===SEL_WAVE?'▶':''}</td><td>${w.manual?'<span class="tag" style="background:#b03a2e;color:#fff">手動</span><br>':w.tag?'<span class="tag" style="background:#8a5a1e;color:#fff">定型</span><br>':''}${w.dir==='up'?'上げ':'下げ'}${w.tag&&!w.manual?`<div class="muted" style="font-size:10.5px;max-width:110px">${w.tag.replace(/^定型/,'')}</div>`:''}</td><td><b>${w.A[0]}</b><br>${fmt(w.A[1])} ${'★'.repeat(w.A_rank||1)}</td><td class="muted">B ${w.B[0]} ${fmt(w.B[1])}<br>C ${w.C[0]} ${fmt(w.C[1])}</td><td class="num">AB ${w.ab}<br>BC ${w.bc}<br>AC ${w.ac}</td><td>${Object.entries(w.calc).map(([k,v])=>`<span class="tag ${k}">${k}</span>${fmt(v)}${w.achieved[k]?' <span class="ok">✓</span>':''}`).join('<br>')}</td><td class="muted">${w.d_info.map(d=>`${d.rel}: ${d.date||'-'}${d.offset>=0?` (+${d.offset}${u})`:''}`).join('<br>')}</td></tr>`).join('')+'</table>';
  h+=`<h2>基本数値足（陰連・陽連）</h2><div class="nb">`+F.nbars.filter(n=>n.current).map(n=>`<div><div class="muted">${n.label}</div><b>${n.current.sign}${n.current.len}連</b> <span class="muted">${n.current.start}〜</span><div class="hist">${n.history.map(x=>`<span class="${x.sign}">${x.sign}${x.len}</span>`).join('')}</div><div class="muted">分岐: ${n.thresholds.slice(0,3).map(t=>`${t.ahead}本後 ${fmt(t.open)}`).join(' / ')}</div></div>`).join('')+'</div>';
  if(FRAME.startsWith('daily')){ const M=DATA.margin;
    h+=`<h2>信用残の推移（週次・直近約1か月）</h2>`;
    if(!M||M.error){h+=`<div class="muted">取得できませんでした${M&&M.error?'：'+M.error:''}</div>`}
    else{const rows=M.rows; const last=rows[rows.length-1], first=rows[0];
      const trend=(k,lab)=>{const a=first[k],b=last[k]; if(a==null||b==null) return ''; const d=b-a, pc=a?(d/a*100).toFixed(1):'-'; return `${lab} ${d>=0?'+':''}${fmt(d)}（${d>=0?'+':''}${pc}%）`};
      h+=`<div class="muted" style="margin-bottom:6px">${first.date}→${last.date}: ${trend('buy','買い残')}、${trend('sell','売り残')}、信用倍率 ${first.ratio??'-'}→${last.ratio??'-'}</div>`;
      h+=`<table><tr><th>日付</th><th class="num">買い残</th><th class="num">前週比</th><th class="num">売り残</th><th class="num">前週比</th><th class="num">倍率</th></tr>`+
        rows.map(r=>`<tr><td>${r.date}</td><td class="num">${fmt(r.buy)}</td><td class="num ${r.buy_chg>0?'ng':'ok'}">${r.buy_chg==null?'-':(r.buy_chg>0?'+':'')+fmt(r.buy_chg)}</td><td class="num">${fmt(r.sell)}</td><td class="num">${r.sell_chg==null?'-':(r.sell_chg>0?'+':'')+fmt(r.sell_chg)}</td><td class="num">${r.ratio??'-'}</td></tr>`).join('')+'</table>';
      h+=`<div id="marginchart" style="height:160px;margin-top:6px"></div>`;
      setTimeout(()=>{ if(!$('#marginchart')) return; Plotly.newPlot('marginchart',[
        {x:rows.map(r=>r.date),y:rows.map(r=>r.buy),type:'bar',name:'買い残',marker:{color:'#c0392b'}},
        {x:rows.map(r=>r.date),y:rows.map(r=>r.sell),type:'bar',name:'売り残',marker:{color:'#1f5f8b'}},
        {x:rows.map(r=>r.date),y:rows.map(r=>r.ratio),type:'scatter',name:'倍率',yaxis:'y2',line:{color:'#8a5a1e'},mode:'lines+markers'}],
        {margin:{l:50,r:40,t:5,b:30},barmode:'group',yaxis:{tickformat:',.0f'},yaxis2:{overlaying:'y',side:'right',title:'倍率'},legend:{orientation:'h',y:1.2,font:{size:10}},paper_bgcolor:'#fff',plot_bgcolor:'#fff',xaxis:{type:'category'}},{displaylogo:false,responsive:true})},0);
      if(M.source&&M.source!=='synthetic') h+=`<div class="muted">出所: ${M.source}</div>`}}
  h+=`<details><summary>テキストレポート全文（細田理論の注記付き）</summary><div class="md">${mdToHtml(F.markdown)}</div></details>`;
  $('#side').innerHTML=h;
  $('#side').querySelectorAll('tr.wv').forEach(r=>r.onclick=()=>{SEL_WAVE=+r.dataset.i; PEND=null; drawChart(F); drawSide(F)});
  $('#side').querySelectorAll('tr.lv').forEach(r=>r.onclick=()=>{const p=+r.dataset.p; SEL_LEVEL=SEL_LEVEL===p?null:p; drawChart(F); $('#side').querySelectorAll('tr.lv').forEach(x=>x.classList.toggle('sel',+x.dataset.p===SEL_LEVEL))});
}
const niceStep=x=>{const p=Math.pow(10,Math.floor(Math.log10(x))); const m=x/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
const md=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function mdToHtml(src){
  const out=[]; let inList=false, depth=0;
  const closeList=()=>{while(depth>0){out.push('</ul>');depth--} inList=false};
  for(const raw of src.split('\n')){
    const m=raw.match(/^(\s*)- (.*)$/);
    if(m){const d=Math.floor(m[1].length/4)+1; while(depth<d){out.push('<ul>');depth++} while(depth>d){out.push('</ul>');depth--} out.push('<li>'+md(m[2])+'</li>'); inList=true; continue}
    if(inList) closeList();
    if(/^### /.test(raw)) out.push('<h3>'+md(raw.slice(4))+'</h3>');
    else if(/^## /.test(raw)) out.push('<h2>'+md(raw.slice(3))+'</h2>');
    else if(/^# /.test(raw)) out.push('<h2>'+md(raw.slice(2))+'</h2>');
    else if(raw.trim()==='') out.push('');
    else out.push('<p>'+md(raw)+'</p>');
  }
  closeList(); return out.join('\n');
}
</script>
